[workspace]
resolver = "2"
members = [
    "crates/varif-core",
    "crates/varif-cli",
    "crates/varif-gui",
    "crates/varif-bevy",
]
# What plain `cargo build`, `cargo test` and `cargo run` act on. The window
# crates are left out so that they stay quick; run them with
# `cargo run -p varif-gui` or `cargo bevy`.
default-members = ["crates/varif-core", "crates/varif-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
ron = "0.12"
bevy = "0.20"
