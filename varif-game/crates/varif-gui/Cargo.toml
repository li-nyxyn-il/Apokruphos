[package]
name = "varif-gui"
version.workspace = true
edition.workspace = true
description = "A simple desktop window for the Varif world model, built on egui."

[dependencies]
varif-core = { path = "../varif-core" }
eframe = "0.37"
ron.workspace = true
# Decodes the map picture drawn under the places (see src/background.rs).
image = { version = "0.25", default-features = false, features = ["png"] }

# Only for the web build (see index.html and the README).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "Navigator"] }
