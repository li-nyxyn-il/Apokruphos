# Builds the Varif game and runs its tests on every pull request, and on
# every push to main so that main's own state is checked too.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request cancels the run still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: varif-game
    steps:
      - uses: actions/checkout@v4

      # The window crate is built on eframe, which needs these to compile on Linux.
      - name: Install system libraries for the window
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: varif-game

      # --workspace takes in the window too, which plain `cargo test` leaves out.
      - name: Run the tests
        run: cargo test --workspace --locked
